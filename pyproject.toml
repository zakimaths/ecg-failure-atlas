[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ecg-failure-atlas"
version = "0.2.0"
description = "Replayable experiments in ECG-like signal distortion"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "plotly==6.1.2"]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
ecg-atlas = "ecg_atlas.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_atlas"]
